name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  server-linux:
    name: Server (Ubuntu 24.04, Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-httpserver-dev qt6-websockets-dev \
            qt6-declarative-dev qt6-multimedia-dev qt6-tools-dev \
            qt6-serialport-dev libgl1-mesa-dev \
            libasound2-dev libusb-1.0-0-dev libftdi1-dev \
            libmad0-dev libsndfile1-dev libfftw3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -Dserver=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Smoke test - daemon starts headless
        run: |
          QT_QPA_PLATFORM=offscreen ./build/server/src/orchidlightsd --version
          QT_QPA_PLATFORM=offscreen ./build/server/src/orchidlightsd

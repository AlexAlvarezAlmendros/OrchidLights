name: build

on:
  # Every branch, not just main. Restricting push to main left work on a
  # feature branch relying solely on the pull_request event, and when that
  # event went missing a commit sat on the branch with no CI at all -- while
  # `gh pr checks` cheerfully reported the *previous* run as green.
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A branch with an open pull request would otherwise build twice for the same
# commit. Newer pushes also cancel older runs, which matters when a fix follows
# a mistake by a minute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-linux:
    name: Server (Ubuntu 24.04, Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./install-deps.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Before CMake: the install rule picks up web/dist if it is there, and the
      # daemon serves its own interface only when it has been built.
      - name: Build the web interface
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build

      - name: Configure
        run: cmake -S . -B build -G Ninja -Dserver=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Install
        run: sudo cmake --install build

      - name: Smoke test - load a project with no UI
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen

          orchidlightsd --version

          # --check loads everything, reports and exits. Without it the daemon
          # stays up serving, which is the point of it but not of a test.
          out=$(orchidlightsd --check resources/samples/Sample.qxw)
          echo "$out"

          check() {
            echo "$out" | grep -qE "$1" || { echo "::error::$2"; exit 1; }
          }
          # Exact counts, taken from Sample.qxw itself: 13 top-level <Fixture>
          # elements and 114 <Function> elements under <Engine>. Anything else
          # means the loader started dropping things.
          check '^Fixture library: [1-9][0-9]{2,} manufacturers$' "the fixture library did not load"
          check '^  system: /usr/share/orchidlights/fixtures$'    "the installed system library was not picked up"
          check '^Universes: 4$'                                  "wrong universe count"
          check '^Fixtures: 13$'                                  "wrong fixture count -- the loader is dropping fixtures"
          check '^Functions: 114$'                                "wrong function count -- the loader is dropping functions"
          # A zero exit also means Doc's error log was empty, so every fixture
          # resolved to a real definition rather than a generic dimmer.

          # The engine is useless without its output plugins, and finding them
          # is exactly what used to be broken outside a stock install.
          check '^Output plugins: [1-9][0-9]* from /usr/lib/' "no output plugins were loaded"
          check '^  ArtNet$'                                  "the ArtNet plugin is missing"
          check '^  DMX USB$'                                 "the DMX USB plugin is missing"

          # An Audio function needs a decoder to read its file. The runner has
          # no sound server, so the outputs are legitimately zero here -- the
          # formats are not, and zero of them means the decoder did not install
          # or was not found.
          check '^Audio: [1-9][0-9]* formats'                 "no audio decoder was found"

      - name: The install ships our desktop integration and none of QLC+'s
        run: |
          set -euo pipefail

          # Validation tools, not build dependencies, so they are not in
          # install-deps.sh.
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream

          for f in /usr/share/applications/orchidlights.desktop \
                   /usr/share/icons/hicolor/scalable/apps/orchidlights.svg \
                   /usr/share/metainfo/org.orchidlights.OrchidLights.metainfo.xml \
                   /usr/lib/systemd/user/orchidlights.service; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done

          # The inherited entries launch qlcplus and qlcplus-fixtureeditor,
          # which this build does not produce. Shipping them would put broken
          # launchers in the application menu.
          #
          # Checked against CMake's install manifest rather than by scanning
          # /usr: the runner images carry unrelated packages, and mysqlcheck
          # happens to contain "qlc".
          manifest=build/install_manifest.txt
          [ -f "$manifest" ] || { echo "::error::no install manifest"; exit 1; }

          # libqlcplusengine keeps its upstream name on purpose, and the fixture
          # definitions are inherited data. Anything else would be a leak.
          leaked=$(grep -i 'qlc' "$manifest" \
                   | grep -v '/fixtures/' \
                   | grep -v 'libqlcplusengine' || true)
          if [ -n "$leaked" ]; then
            echo "::error::inherited QLC+ files leaked into the install:"
            echo "$leaked"
            exit 1
          fi

          desktop-file-validate /usr/share/applications/orchidlights.desktop
          appstreamcli validate --no-net \
            /usr/share/metainfo/org.orchidlights.OrchidLights.metainfo.xml

      - name: Smoke test - the daemon serves its own interface
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen

          orchidlightsd --port 9998 --no-output resources/samples/Sample.qxw &
          daemon=$!
          trap 'kill $daemon 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            curl -sf --max-time 1 http://127.0.0.1:9998/api/v1/status > /dev/null && break
            sleep 0.2
          done

          page=$(curl -sf --max-time 5 http://127.0.0.1:9998/)
          echo "$page" | grep -q '<div id="root">' \
            || { echo "::error::the daemon did not serve the web interface"; exit 1; }

          asset=$(echo "$page" | grep -oE 'assets/[^"]+\.js' | head -1)
          [ -n "$asset" ] || { echo "::error::no script in the served page"; exit 1; }

          curl -sf --max-time 5 "http://127.0.0.1:9998/$asset" > /dev/null \
            || { echo "::error::the interface's own script 404s"; exit 1; }

          # The asset route must not become a way out of its directory.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 'http://127.0.0.1:9998/assets/..%2F..%2Findex.html')
          [ "$code" = "404" ] || [ "$code" = "400" ] \
            || { echo "::error::asset traversal answered $code"; exit 1; }

      - name: Smoke test - the daemon refuses to start without a fixture library
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen

          # Run somewhere with no library at all: not installed, no user
          # directory, and far enough from the sources that the build-tree
          # fallback cannot reach them either.
          work=$(mktemp -d)
          cp resources/samples/Sample.qxw "$work/"
          sudo mv /usr/share/orchidlights/fixtures /usr/share/orchidlights/fixtures.hidden

          set +e
          out=$(cd "$work" && HOME="$work" orchidlightsd --check --no-output Sample.qxw 2>&1)
          code=$?
          set -e

          sudo mv /usr/share/orchidlights/fixtures.hidden /usr/share/orchidlights/fixtures

          echo "$out"
          [ "$code" -eq 1 ] || { echo "::error::expected exit 1, got $code"; exit 1; }
          echo "$out" | grep -q 'No system fixture library found' \
            || { echo "::error::the missing library was not reported"; exit 1; }

      - name: Smoke test - the web API drives the engine
        run: ./server/test/api-smoke.sh orchidlightsd resources/samples/Sample.qxw

      - name: Shutdown smoke test (signals, token-gated route, last frame on the wire)
        run: ./server/test/shutdown-smoke.sh orchidlightsd

      - name: Auth smoke test (guarded daemon, connect screen, token handover)
        run: ./server/test/auth-smoke.sh orchidlightsd resources/samples/Sample.qxw

      - name: Project smoke test (open/save-as by path, recents, autosave, recovery)
        run: ./server/test/project-smoke.sh orchidlightsd resources/samples/Sample.qxw

      - name: Grand master smoke test (scaling on the wire, hot mode switch, fade-and-stop)
        run: ./server/test/grandmaster-smoke.sh orchidlightsd

      - name: Simple desk smoke test (keypad grammar, bare wire, override vs functions)
        run: ./server/test/simpledesk-smoke.sh orchidlightsd

      - name: Dump smoke test (both desks merged, filters exact in the .qxw, record-over)
        run: ./server/test/dump-smoke.sh orchidlightsd

      - name: Input smoke test (loopback wire, button and GM bindings, feedback, .qxw)
        run: ./server/test/input-smoke.sh orchidlightsd

      - name: Chaser smoke test (per-step fades measured, reorder persisted, sequence values)
        run: ./server/test/chaser-smoke.sh orchidlightsd

      - name: RGB matrix smoke test (blend and control on the wire, 5 colours, bake)
        run: ./server/test/rgbmatrix-smoke.sh orchidlightsd

      - name: Script/audio smoke test (checker points at the line, waveform hears silence)
        run: ./server/test/scriptaudio-smoke.sh orchidlightsd

      - name: Palette smoke test (retint without touching the scene, monotonic fanning)
        run: ./server/test/palette-smoke.sh orchidlightsd

      - name: Clock smoke test (the agenda rings with no browser open)
        run: ./server/test/clock-smoke.sh orchidlightsd

      - name: VC parity smoke test (side faders on the wire, pages turned by input)
        run: ./server/test/vcparity-smoke.sh orchidlightsd

      - name: Fixture smoke test (batches, clone, heads, group grid)
        run: ./server/test/fixture-smoke.sh orchidlightsd

      - name: Rig tools smoke test (panel wizard, remap, linked, import)
        run: ./server/test/rigtools-smoke.sh orchidlightsd

      - name: I/O smoke test (two outputs, metronome, chasers on beats, profiles)
        run: ./server/test/io-smoke.sh orchidlightsd

      # The test client uses Node's built-in WebSocket, which landed in 21.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test - the live feed streams DMX
        run: ./server/test/ws-smoke.sh orchidlightsd resources/samples/Sample.qxw

      - name: Smoke test - saving a project preserves what we do not model
        run: ./server/test/roundtrip-smoke.sh orchidlightsd resources/samples/Sample.qxw

      # Everything else about an XY pad can work while no light moves, so this
      # one reads the universe back: limits, reversed axes and the fine channels
      # that separate 512 positions from 65536.
      - name: Smoke test - an XY pad puts the right values on the universe
        run: ./server/test/xypad-smoke.sh orchidlightsd server/test/data/xypad.qxw

      # A solo frame that is only solo in one browser is worse than one that is
      # not solo at all, so the rule lives in the daemon and is checked there.
      - name: Smoke test - a solo frame drops what it replaces
        run: ./server/test/frames-smoke.sh orchidlightsd server/test/data/vc-frames.qxw

      # Editing the console re-registers everything with the engine. A fader
      # that survives that in name but not in effect is a lamp stuck up.
      - name: Smoke test - an edit does not strand the faders holding a look
        run: ./server/test/fader-smoke.sh orchidlightsd server/test/data/vc-references.qxw

      # A submaster scales the widgets around it. The two assertions that matter
      # most are negatives: a colour wheel it must not dim, and a head it must
      # not aim -- both of which a value-multiplying shortcut would break while
      # looking like it worked.
      - name: Smoke test - a submaster scales what it should and nothing else
        run: ./server/test/submaster-smoke.sh orchidlightsd server/test/data/vc-submaster.qxw

      # A matrix preset can look applied in the model and be wrong on the wire,
      # so the colour ones are read back off the universe.
      - name: Smoke test - a matrix widget applies its presets
        run: ./server/test/matrix-smoke.sh orchidlightsd server/test/data/vc-matrix.qxw

      # A runner has no microphone, which is the point: the daemon has to report
      # that it could not listen rather than claim it is listening. The bars,
      # the switch and the input list are checked either way.
      - name: Smoke test - audio triggers say what they can and cannot hear
        run: ./server/test/audio-smoke.sh orchidlightsd server/test/data/vc-audio.qxw

      # A channels group is one fader over channels picked by hand. The CRUD is
      # the easy half; the half that matters is that a channel dropped from a
      # group, or a group deleted, is let go of at zero rather than left latched
      # with the one control that could lower it now gone.
      - name: Smoke test - channels groups drive their channels and let go of them
        run: ./server/test/channelgroup-smoke.sh orchidlightsd server/test/data/channel-groups.qxw

      # A channel modifier is the curve a channel's values pass through on the
      # way out, and it belongs to the patch rather than to any cue. Read off
      # the wire, including the case the naive implementation gets wrong: a
      # channel left latched with nothing holding it, which is written by
      # nobody and would stay uncurved for as long as the look was up.
      - name: Smoke test - channel modifiers bend what they say they bend
        run: ./server/test/modifier-smoke.sh orchidlightsd server/test/data/modifiers.qxw

      # A show is a multi-track timeline, and a timeline is the one thing here
      # where being right in the model and wrong in time cannot be told apart
      # from the outside. So the test plays a two-scene show and reads the wire
      # at 400 ms and at 1200 ms.
      - name: Smoke test - a show plays what its timeline says, when it says
        run: ./server/test/show-smoke.sh orchidlightsd server/test/data/show.qxw

      # The plan draws each lamp in the colour it is putting out, and works that
      # out in the browser from the DMX frames. What has to be right on this
      # side is the map it works from, so each role is checked by lighting that
      # channel and reading the wire back.
      - name: Smoke test - the plan names the channels that decide a lamp's colour
        run: ./server/test/plan-smoke.sh orchidlightsd server/test/data/plan.qxw

      # An Audio function makes a sound, or says which of the two things it
      # needs is missing. A runner has neither a sound server nor speakers, so
      # what gets checked here is the honesty half: that the decoders load with
      # --no-output (they used to be switched off by it, silently, in every test
      # in this repository) and that the daemon reports it cannot play and why.
      - name: Smoke test - audio functions play, or say why they cannot
        run: ./server/test/audioplay-smoke.sh orchidlightsd server/test/data/vc-references.qxw

      # The property everything in F6 rests on: a Virtual Console goes through
      # the node tree and comes back identical. If this fails, editing widgets
      # stops being safe.
      - name: Smoke test - the XML tree round-trips every project
        run: ./server/test/xmltree-roundtrip.sh orchidlightsd

      # And what editing does to it: only the attributes asked for change, and
      # a widget id is never confused with the fixture id an XY pad shares it
      # with.
      - name: Smoke test - editing the Virtual Console changes only what it should
        run: ./server/test/vc-edit-smoke.sh orchidlightsd server/test/data/vc-references.qxw

      # The API tests prove the daemon does the right thing when asked; this one
      # drives the built interface in a real browser and proves it asks. Runs on
      # the sample too, which carries no widget ids at all -- QLC+ 4 wrote none
      # -- so the "assign ids" path is exercised on the file QLC+ itself ships.
      - name: Smoke test - the interface edits a console in a real browser
        run: |
          set -euo pipefail
          # The script skips itself when there is no browser, which is right on
          # a laptop and useless here: a silent skip in CI is a test that stops
          # running and nobody notices.
          command -v google-chrome > /dev/null \
            || { echo "::error::no Chrome on the runner; the UI test would skip"; exit 1; }

          ./server/test/ui-smoke.sh orchidlightsd server/test/data/vc-actions.qxw
          ./server/test/ui-smoke.sh orchidlightsd server/test/data/vc-references.qxw
          ./server/test/ui-smoke.sh orchidlightsd server/test/data/vc-frames.qxw
          ./server/test/ui-smoke.sh orchidlightsd server/test/data/vc-matrix.qxw
          ./server/test/ui-smoke.sh orchidlightsd server/test/data/vc-audio.qxw
          ./server/test/ui-smoke.sh orchidlightsd server/test/data/channel-groups.qxw
          ./server/test/ui-smoke.sh orchidlightsd server/test/data/modifiers.qxw
          ./server/test/ui-smoke.sh orchidlightsd server/test/data/show.qxw
          ./server/test/ui-smoke.sh orchidlightsd server/test/data/plan.qxw
          # The sample is built out of frames: 125 widgets, and until they were
          # rendered four of them were on screen.
          ./server/test/ui-smoke.sh orchidlightsd resources/samples/Sample.qxw

      - name: Smoke test - an unresolvable fixture is reported, not swallowed
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen

          # The library is present here; it is one definition that is missing.
          # The engine happily patches such a fixture as a generic dimmer, which
          # is silent data loss on a real rig.
          set +e
          out=$(orchidlightsd --check --no-output server/test/data/unknown-fixture.qxw 2>&1)
          code=$?
          set -e

          echo "$out"
          [ "$code" -eq 2 ] || { echo "::error::expected exit 2, got $code"; exit 1; }
          echo "$out" | grep -q 'No fixture definition found for' \
            || { echo "::error::the unresolved fixture was not named"; exit 1; }

  appimage:
    name: AppImage (Ubuntu 24.04, Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./install-deps.sh --appimage

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Without this the bundle ships a daemon that answers a JSON stub at its
      # own URL: the one artifact a user actually downloads, with no interface
      # in it.
      - name: Build the web interface
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build the AppImage
        # The runners have no FUSE, and appimagetool is itself an AppImage.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./create-appimage.sh

      - name: Smoke test - the bundle is self contained
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen

          # A clean HOME, so nothing outside the bundle can supply the library,
          # and a relative path, which the stock AppImageKit AppRun would break.
          home=$(mktemp -d)
          out=$(HOME="$home" ./OrchidLights-x86_64.AppImage --check resources/samples/Sample.qxw)
          echo "$out"

          check() {
            echo "$out" | grep -qE "$1" || { echo "::error::$2"; exit 1; }
          }
          check '^Fixture library: [1-9][0-9]{2,} manufacturers$' "the bundled fixture library was not found"
          check '^Fixtures: 13$'                                  "the bundle did not load the project"
          check '^Functions: 114$'                                "the bundle dropped functions"
          # The compiled-in plugin path points at the build machine, so finding
          # these proves the executable-relative lookup works.
          check '^Output plugins: [1-9][0-9]* from '              "the bundled output plugins were not found"
          check '^  ArtNet$'                                      "the ArtNet plugin is missing from the bundle"
          # Same for the audio decoder, which is found the same way and which
          # nothing checked was in the bundle at all.
          check '^Audio: [1-9][0-9]* formats'                     "the bundle carries no audio decoder"

      - name: Smoke test - the bundle carries the web interface
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen

          home=$(mktemp -d)
          HOME="$home" ./OrchidLights-x86_64.AppImage --port 9998 --no-output \
              resources/samples/Sample.qxw &
          daemon=$!
          trap 'kill $daemon 2>/dev/null || true' EXIT

          for _ in $(seq 1 100); do
            curl -sf --max-time 1 http://127.0.0.1:9998/api/v1/status > /dev/null && break
            sleep 0.2
          done

          curl -sf --max-time 5 http://127.0.0.1:9998/ | grep -q '<div id="root">' \
            || { echo "::error::the AppImage serves no web interface"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: OrchidLights-x86_64.AppImage
          path: OrchidLights-x86_64.AppImage
          if-no-files-found: error

  desktop:
    name: Desktop shell (Tauri, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The shell wraps the daemon, so the daemon is built here too -- the
      # smoke test is about the pair, not about Rust compiling.
      - name: Install build dependencies
        run: |
          ./install-deps.sh
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the web interface
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build the daemon
        run: |
          cmake -S . -B build -G Ninja -Dserver=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Lint the shell
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Build the shell
        working-directory: desktop/src-tauri
        run: cargo build

      # xvfb because WebKitGTK needs a display even to fail politely; the
      # assertions themselves are all from outside (HTTP, /proc, signals).
      - name: Shell smoke test
        run: xvfb-run -a desktop/test/shell-smoke.sh

  desktop-bundle:
    name: Desktop bundle (deb + AppImage)
    # Bundles are release artifacts, not per-PR noise: a PR is already covered
    # by the desktop job's build+smoke, and this job costs a full extra
    # Release build of daemon and shell.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          ./install-deps.sh
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the web interface
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage the sidecar (daemon + plugins + fixtures + web)
        run: ./desktop/scripts/collect-sidecar.sh

      - name: Build the bundles
        working-directory: desktop/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: pnpm dlx @tauri-apps/cli@^2 build --bundles deb,appimage

      # The deb, installed for real and driven from outside: the daemon must
      # come up self-contained (fixtures, plugins, audio decoders all from the
      # package) and die with its window.
      - name: Install and smoke the deb
        run: |
          sudo apt-get install -y ./desktop/src-tauri/target/release/bundle/deb/OrchidLights_*_amd64.deb
          xvfb-run -a bash -c '
            set -eu
            orchidlights-desktop > /tmp/shell.log 2>&1 &
            SHELL_PID=$!
            DP=""
            for _ in $(seq 1 120); do
              DP=$(pgrep -P "$SHELL_PID" orchidlightsd | head -1 || true)
              [ -n "$DP" ] && break
              kill -0 $SHELL_PID 2>/dev/null || { cat /tmp/shell.log; exit 1; }
              sleep 0.5
            done
            [ -n "$DP" ] || { echo "no daemon"; exit 1; }
            PORT=$(tr "\0" "\n" < /proc/$DP/cmdline | grep -A1 -- --port | tail -1)
            for _ in $(seq 1 100); do
              curl -sf "http://127.0.0.1:$PORT/api/v1/status" > /dev/null 2>&1 && break
              sleep 0.3
            done
            STATUS=$(curl -sf "http://127.0.0.1:$PORT/api/v1/status")
            echo "$STATUS" | python3 -c "
          import json, sys
          body = json.load(sys.stdin)
          assert body[\"manufacturers\"] > 100, body
          assert len(body[\"outputPlugins\"]) >= 10, body
          assert len(body[\"audioFormats\"]) >= 5, body
          "
            kill -TERM $SHELL_PID
            for _ in $(seq 1 40); do
              kill -0 "$DP" 2>/dev/null || exit 0
              sleep 0.25
            done
            echo "the daemon outlived its shell"; exit 1
          '

      # And the AppImage boots the same self-contained pair.
      - name: Smoke the AppImage
        run: |
          AI=$(ls desktop/src-tauri/target/release/bundle/appimage/OrchidLights_*_amd64.AppImage)
          chmod +x "$AI"
          xvfb-run -a bash -c '
            set -eu
            APPIMAGE_EXTRACT_AND_RUN=1 "'"$AI"'" > /tmp/ai.log 2>&1 &
            DP=""
            for _ in $(seq 1 120); do
              DP=$(pgrep -f "sidecar/bin/orchidlightsd" | head -1 || true)
              [ -n "$DP" ] && break
              sleep 0.5
            done
            [ -n "$DP" ] || { echo "no daemon"; cat /tmp/ai.log; exit 1; }
            PORT=$(tr "\0" "\n" < /proc/$DP/cmdline | grep -A1 -- --port | tail -1)
            for _ in $(seq 1 100); do
              curl -sf "http://127.0.0.1:$PORT/api/v1/status" > /dev/null 2>&1 && break
              sleep 0.3
            done
            curl -sf "http://127.0.0.1:$PORT/api/v1/status" | grep -q "\"manufacturers\"" || exit 1
            SHELL_PID=$(ps -o ppid= -p "$DP" | tr -d " ")
            kill -TERM "$SHELL_PID"
            for _ in $(seq 1 40); do
              kill -0 "$DP" 2>/dev/null || exit 0
              sleep 0.25
            done
            echo "the daemon outlived its shell"; exit 1
          '

      - uses: actions/upload-artifact@v4
        with:
          name: OrchidLights-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/OrchidLights_*_amd64.deb
            desktop/src-tauri/target/release/bundle/appimage/OrchidLights_*_amd64.AppImage
          if-no-files-found: error

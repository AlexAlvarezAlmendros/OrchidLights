<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OrchidLights</title>
<style>
  /* The engine's own palette, so the hand-off to the real interface is not a
     flash of a different program. */
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d0e11; color: #e8eaee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  main { text-align: center; display: flex; flex-direction: column; gap: 0.9rem; align-items: center; max-width: 34rem; padding: 1rem; }
  .mark { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(145deg, #7c5cff, #b23cff); }
  h1 { font-size: 1.1rem; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; font-size: 0.85rem; color: #9aa1ad; line-height: 1.45; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  /* The failure state, driven by the shell. Hidden until it is the truth. */
  #trouble { display: none; }
  body[data-state="error"] #trouble { display: block; color: #ff7a7a; }
  body[data-state="error"] .pulse { display: none; }
  code { font-size: 0.8em; color: #e8eaee; }
</style>
</head>
<body>
<main>
  <div class="mark"></div>
  <h1>OrchidLights</h1>
  <p class="pulse" id="state">Arrancando el motor…</p>
  <p id="trouble"></p>
</main>
</body>
</html>

      summary: Cambiar los valores o el fanning de una palette.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        "200":
          description: La palette.
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [grupos]
      summary: Borrar una palette.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Borrada.
          content:
            application/json:
              schema: {type: object, properties: {removed: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/palettes/{id}/apply:
    post:
      tags: [grupos]
      summary: Aplicar una palette a unas fixtures o a una escena.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      description: |
        Aterriza en la **mesa en vivo**, no en una escena ni en el documento:
        los valores que la palette resuelve para esas fixtures se clavan como
        si vinieran de `PUT /api/v1/live`. Para convertirlo en escena, después
        `POST /api/v1/dump`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixtures]
              properties:
                fixtures:
                  type: array
                  description: Sobre qué lámparas. Vacío se rechaza.
                  items: {type: integer}
      responses:
        "200":
          description: A cuántos canales llegó.
          content:
            application/json:
              schema: {type: object, properties: {applied: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/colorfilters:
    get:
      tags: [grupos]
      summary: Los catálogos de gelatinas — Lee, Rosco y demás.
      responses:
        "200":
          description: Los filtros.
          content:
            application/json:
              schema: {type: object, properties: {filters: {type: array, items: {type: object, additionalProperties: true}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/modifiers:
    get:
      tags: [fixtures]

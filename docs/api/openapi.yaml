        duración, así que no hay barra que dibujar ni final en el que pararlos.
      parameters:
        - {$ref: "#/components/parameters/functionId"}
        - name: trackId
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [function, start]
              properties:
                function: {type: integer}
                start: {type: integer, description: "Milisegundos desde el comienzo del show."}
                duration: {type: integer}
      responses:
        "201":
          description: El elemento colocado.
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

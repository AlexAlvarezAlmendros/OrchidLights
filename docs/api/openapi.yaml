        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/modifiers/{name}:
    get:
      tags: [fixtures]
      summary: Una curva, punto a punto, para dibujarla.
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: La curva.
          content:
            application/json:
              schema: {type: object, properties: {name: {type: string}, curve: {type: array, items: {type: integer}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/vc:
    get:
      tags: [consola]
      summary: La Virtual Console entera, con su geometría.
      description: |
        El árbol de widgets tal y como lo guarda el proyecto, coordenadas
        incluidas. La interfaz las lee como intención —lo que el diseñador puso
        en paralelo es una fila— y refluye; no escala el lienzo.
      responses:
        "200":
          description: El árbol.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/vc/widgets:
    post:
      tags: [consola]
      summary: Añadir un widget a la consola.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, parent]
              properties:
                type:
                  type: string
                  description: Los once tipos de QLC+. No distingue mayúsculas.
                  enum: [Frame, SoloFrame, Button, Slider, Label, SpeedDial, XYPad, CueList, Clock, AudioTriggers, Matrix]
                parent: {type: integer, description: "El marco que lo contiene."}
      responses:
        "201":
          description: El widget creado.
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}, type: {type: string}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/vc/widgets/{id}:
    patch:
      tags: [consola]
      summary: Cambiar un widget — nombre, función, modo, colores, control externo.
      description: |
        Lo que se acepta depende del tipo: una etiqueta tiene nombre y nada más;
        un botón, función y acción; un fader, modo y canales. Un `null` en un
        color o una fuente lo devuelve al **Default** de la mesa, que no es lo
        mismo que elegir un gris parecido.
      parameters: [{$ref: "#/components/parameters/widgetId"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                caption: {type: string}
                functionId: {type: integer, description: "Botón, slider de playback, animación: qué función dispara."}
                chaserId: {type: integer, description: "Cue list: el chaser que corre."}
                action:
                  type: string
                  enum: [toggle, flash, override, blackout, stopall]
                  description: |
                    Botón: qué hace al pulsarlo. `toggle` arranca la función y
                    se queda; `flash` la enciende mientras se sujeta;
                    `override` deja una escena **encima** de lo que corre y
                    se queda — sus canales se escriben después de todas las
                    funciones en marcha y con LTP forzado, así que
                    **sustituyen** lo que HTP habría mezclado: es lo que
                    recolorea un chaser en marcha sin pararlo. Solo una
                    escena tiene esa capa; sobre cualquier otra función
                    `override` se comporta como `toggle`. Dentro de un marco
                    solo un override es una capa sobre el estado del marco,
                    no un estado más: al pulsarlo suelta los otros overrides
                    del marco y deja sus toggles corriendo, y arrancar un
                    toggle del marco suelta los overrides. QLC+ lo lee como
                    `toggle`. `blackout` y `stopall` no llevan función.
                key: {type: [string, "null"], description: "Botón: atajo de teclado."}
                flashOverride: {type: integer, description: "Botón en flash: intensidad forzada."}
                flashForceLTP: {type: boolean}
                startupIntensity: {type: number, description: "Con qué intensidad arranca lo que dispara."}
                sliderMode:
                  type: string
                  enum: [level, playback, submaster, adjust]
                  description: |
                    Qué es este fader. `level` sujeta canales a UN valor;
                    `playback` no escribe canales —a cero para su función, por
                    encima la arranca y le mantiene la intensidad—; `submaster`
                    escala todo lo que cuelga de su marco; `adjust` mueve un
                    atributo de una función.
                levelChannels:
                  type: array
                  description: "Slider en modo nivel: qué canales sujeta."
                  items:
                    type: object
                    required: [fixture, channel]
                    properties:
                      fixture: {type: integer}
                      channel: {type: integer, description: "Índice dentro de la fixture, desde 0."}
                sliderStyle: {type: string}
                sideFaderMode: {type: string, description: "Cue list: qué hace el fader lateral de crossfade."}
                attribute: {type: string, description: "Slider en modo adjust: qué atributo mueve."}
                adjust: {type: object, additionalProperties: true}
                padHeads: {type: array, description: "XY pad: las cabezas que apunta, con sus límites y ejes invertidos.", items: {type: object, additionalProperties: true}}
                padPresets: {type: array, items: {type: object, additionalProperties: true}}
                geometry:
                  type: object
                  description: Posición y tamaño en el lienzo original del show.
                  properties:
                    x: {type: integer}
                    y: {type: integer}
                    width: {type: integer}
                    height: {type: integer}
                page: {type: integer, description: "En qué página del marco que lo contiene vive."}
                pages: {type: integer, description: "Marco: cuántas páginas tiene."}
                pagesLoop: {type: boolean}
                pageShortcuts: {type: array, items: {type: object, additionalProperties: true}}
                pageInputs: {type: array, items: {type: object, additionalProperties: true}}
                frameStyle: {type: string}
                clockType: {type: string, enum: [clock, stopwatch, countdown]}
                clockTime: {type: integer}
                schedules: {type: array, description: "Reloj: la agenda semanal, que suena aunque no haya navegador abierto.", items: {type: object, additionalProperties: true}}
                background:
                  type: [string, "null"]
                  description: |
                    Color de fondo, "#rrggbb". `null` lo devuelve al **Default**
                    de la mesa, que no es lo mismo que elegir un gris que se le
                    parezca: QLC+ escribe «Default» y cada tema lo pinta a su
                    manera.
                foreground: {type: [string, "null"], description: "Color del texto, con la misma regla para null."}
                font:
                  type: [string, "null"]
                  description: |
                    `QFont::toString()` — dieciséis campos separados por comas.
                    Mandar la familia a secas sería una fuente sin tamaño, sin
                    peso y sin estilo: algo que no eligió nadie.
                input:
                  type: [object, "null"]
                  description: |
                    Control externo. Se aprende pulsándolo: mueve el fader
                    físico y lee `GET /api/v1/input/last`.

                    `null` **borra** el elemento en vez de vaciarlo: un
                    `<Input>` sin atributos lo lee QLC+ como universo 0, canal 0
                    — una asignación a algo real, y a lo que no es.
                  properties:
                    universe: {type: integer}
                    channel: {type: integer}
      responses:
        "200":
          description: El widget ya cambiado.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [consola]
      summary: Borrar un widget y lo que cuelgue de él.
      parameters: [{$ref: "#/components/parameters/widgetId"}]
      responses:
        "200":
          description: Borrado.
          content:
            application/json:
              schema: {type: object, properties: {removed: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/vc/widgets/{id}/press:
    post:
      tags: [consola]
      summary: Pulsar un widget de la consola, con su semántica propia.
      description: |
        Un widget es más que la función a la que apunta: un botón en modo flash
        se enciende mientras se sujeta y se apaga al soltar, uno en modo
        override deja su escena pisando lo que corre y la suelta a la
        siguiente pulsación, uno dentro de un marco solo mata a sus hermanos,
        y Blackout y Stop All no son funciones en absoluto.

        Esta ruta pasa por el mismo sitio que un ala MIDI, así que hace
        exactamente lo mismo que hacer clic. Arrancar la función a mano
        —`POST /functions/{id}/start`— es otra cosa: no sabe de flash, no sabe
        de marcos solo, y no es lo que hace ese botón.
      parameters: [{$ref: "#/components/parameters/widgetId"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                # Citado: en YAML 1.1 `on` sin comillas es el booleano true, y
                # el campo acabó llamándose "true" en el JSON generado.
                "on":
                  type: boolean
                  default: true
                  description: |
                    El flanco. Ausente es una pulsación. Un botón en flash
                    necesita también el `false` de soltar: quien solo sabe
                    pulsar deja el rig encendido.
      responses:
        "200":
          description: |
            El estado en el que quedó — 1 encendido, 0 apagado, -1 nada pasó
            (una suelta que un toggle ignora). Es lo que hizo la pulsación, no
            lo que dice el motor: `start()` solo encola, así que preguntárselo
            un tick antes de tiempo contesta «apagado» sobre un botón que
            acaba de encenderse.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  state: {type: integer, enum: [-1, 0, 1]}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/vc/widgets/{id}/level:
    put:
      tags: [consola]
      summary: Mover un fader de la consola.
      parameters: [{$ref: "#/components/parameters/widgetId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {type: integer, minimum: 0, maximum: 255}
      responses:
        "200":
          description: Dónde quedó.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  value: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: |
            Ese id no mueve nada — una etiqueta, un marco, o un fader que la
            fuente de niveles nunca aprendió. Se dice, en vez de tragárselo: un
            fader que contesta 200 y no hace nada es el peor control que hay.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/vc/widgets/ids:
    post:
      tags: [consola]
      summary: Ponerle identificadores a una consola de QLC+ 4.
      description: |
        Aquella versión no escribía `ID` en ningún widget, y toda edición
        direcciona por id: esos proyectos no son *parcialmente* editables, no lo
        son en absoluto. Esto se los asigna sin tocar nada más.
      responses:
        "200":
          description: Cuántos se asignaron.
          content:
            application/json:
              schema: {type: object, properties: {assigned: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/vc/undo:
    post:
      tags: [consola]
      summary: Deshacer la última edición de la consola.
      responses:
        "200":
          description: Lo que queda a cada lado.
          content:
            application/json:
              schema: {type: object, properties: {undo: {type: integer}, redo: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/vc/redo:
    post:
      tags: [consola]
      summary: Rehacer la última edición deshecha de la consola.
      responses:
        "200":
          description: Lo que queda a cada lado.
          content:
            application/json:
              schema: {type: object, properties: {undo: {type: integer}, redo: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/vc/history:
    get:
      tags: [consola]
      summary: Cuánto historial de consola queda a cada lado.
      responses:
        "200":
          description: Los contadores.
          content:
            application/json:
              schema: {type: object, properties: {undo: {type: integer}, redo: {type: integer}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/layout:
    get:
      tags: [consola]
      summary: El orden en que se apilan los widgets en pantalla.
      description: |
        Vive en una sección propia del `.qxw` (`<OrchidLightsLayout>`), no en el
        `<VirtualConsole>` de QLC+. Cuidado: QLC+ no conserva las secciones que
        no entiende, así que guardar el proyecto *desde QLC+* pierde esto y la
        consola vuelve a ordenarse por su geometría. No se pierde nada más.
      responses:
        "200":
          description: Las páginas y sus filas.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      tags: [consola]
      summary: Reordenar la consola.
      description: |
        Un layout guardado nunca oculta un widget que no menciona: lo que no
        conozca sale igual, en su sitio geométrico. Esconderlo sería el peor
        fallo posible, porque el operador ni siquiera sabría qué le falta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pages:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: integer}
                      rows:
                        type: array
                        items: {type: array, items: {type: integer}}
      responses:
        "200":
          description: El layout guardado en memoria, no en disco.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: {type: boolean}
                  note: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/plan:
    get:
      tags: [plano]
      summary: El rig como plano — dónde está cada lámpara y qué canales la colorean.
      description: |
        Los roles de canal son el punto: la interfaz ya recibe todos los frames
        DMX, así que en cuanto sabe que el rojo de la fixture 4 es el canal 0 y
        su dímer el 6, pinta el plano entero en cada frame sin preguntar nada.
        Mandar colores desde aquí sería un viaje de ida y vuelta por frame, y un
        plano que va con retraso es peor que ninguno, porque uno se lo cree.
      responses:
        "200":
          description: La rejilla del escenario y las fixtures colocadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  grid:
                    type: object
                    properties:
                      width: {type: number}
                      height: {type: number}
                      depth: {type: number}
                      units: {type: string, enum: [meters, feet]}
                  background: {type: boolean}
                  pointOfView: {type: string, enum: [top, front, rightside, leftside]}
                  fixtures: {type: array, items: {$ref: "#/components/schemas/PlanFixture"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/plan/grid:
    put:
      tags: [plano]
      summary: Las dimensiones del escenario.
      description: |
        En **unidades** —metros o pies—, no en milímetros: un escenario mide 12
        de ancho, no 12000. Las posiciones de las fixtures sí van en milímetros
        contra esta rejilla, y confundir las dos es el error natural. Un lado
        mide entre 1 y 1000.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                width: {type: number, minimum: 1, maximum: 1000}
                height: {type: number}
                depth: {type: number, minimum: 1, maximum: 1000}
                units: {type: string, enum: [meters, feet]}
      responses:
        "200":
          description: La rejilla resultante.
          content:
            application/json:
              schema: {type: object, properties: {width: {type: number}, height: {type: number}, depth: {type: number}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/plan/fixtures/{id}:
    put:
      tags: [plano]
      summary: Colocar una lámpara en el escenario.
      description: |
        Posiciones en milímetros contra el `grid`, rotaciones en grados. Se
        guarda en el `<Monitor>` de QLC+, así que el plano abre igual en el
        escritorio.
      parameters: [{$ref: "#/components/parameters/fixtureId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                x: {type: number}
                y: {type: number}
                z: {type: number}
                rotation: {type: number, description: "Giro sobre el eje vertical."}
                rotationX: {type: number}
                rotationZ: {type: number}
                gel: {type: string, description: 'Color del filtro, "#rrggbb".'}
                zoom: {type: integer}
                hidden: {type: boolean}
                locked: {type: boolean}
                invertPan: {type: boolean, description: "Un foco colgado boca abajo se apunta invirtiendo un eje."}
                invertTilt: {type: boolean}
                head: {type: integer, description: "Para colocar una cabeza suelta de una barra."}
                linked: {type: integer, description: "Para colocar una copia dibujada de la misma lámpara."}
      responses:
        "200":
          description: Colocada.
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [plano]
      summary: Quitar una lámpara del plano, sin despatchearla.
      description: Vuelve a la bandeja de las que están sin colocar.
      parameters: [{$ref: "#/components/parameters/fixtureId"}]
      responses:
        "200":
          description: Quitada del plano.
          content:
            application/json:
              schema: {type: object, properties: {removed: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/plan/fixtures/{id}/linked:
    post:
      tags: [plano]
      summary: Dibujar otra vez la misma lámpara en otro sitio del plano.
      description: Solo en el plano y en el fichero; el DMX no se toca.
      parameters: [{$ref: "#/components/parameters/fixtureId"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                head: {type: integer}
                name: {type: string}
                x: {type: number}
                y: {type: number}
      responses:
        "201":
          description: La copia creada.
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}, linked: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/plan/fixtures/{id}/linked/{linkedIndex}:
    delete:
      tags: [plano]
      summary: Quitar una copia dibujada.
      parameters:
        - {$ref: "#/components/parameters/fixtureId"}
        - name: linkedIndex
          in: path
          required: true
          schema: {type: integer}
        - name: head
          in: query
          schema: {type: integer}
      responses:
        "200":
          description: Quitada.
          content:
            application/json:
              schema: {type: object, properties: {removed: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/plan/background:
    get:
      tags: [plano]
      summary: La imagen de fondo del plano.
      responses:
        "200":
          description: La imagen.
          content:
            image/*:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [plano]
      summary: Poner una imagen de fondo, ya subida como asset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset]
              properties: {asset: {type: string}}
      responses:
        "200":
          description: Puesta.
          content:
            application/json:
              schema: {type: object, properties: {background: {type: string}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [plano]
      summary: Quitar la imagen de fondo.
      responses:
        "200":
          description: Quitada.
          content:
            application/json:
              schema: {type: object, properties: {background: {type: [string, "null"]}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/meshes/{group}/{name}:
    get:
      tags: [plano]
      summary: Un modelo 3D de la librería, para dibujar la lámpara en el escenario.
      parameters:
        - name: group
          in: path
          required: true
          schema: {type: string}
        - name: name
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: El modelo.
          content:
            model/obj:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/io:
    get:
      tags: [io]
      summary: Qué plugins de entrada y salida tiene esta máquina, y con qué líneas.
      description: |
        Lo primero que hay que leer para patchear: los nombres de plugin y de
        línea que acepta `PATCH /universes/{index}` son exactamente los que
        salen aquí. Inventárselos es patchear a una salida que no existe, y eso
        no da error hasta que no sale luz.
      responses:
        "200":
          description: Plugins, sus líneas, y los perfiles de entrada instalados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  outputPlugins:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string, examples: [ArtNet, E1.31, DMX USB, MIDI, OSC, Loopback]}
                        lines: {type: array, items: {type: string}}
                  inputPlugins:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        lines: {type: array, items: {type: string}}
                  inputProfiles: {type: array, items: {type: string}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/universes:
    get:
      tags: [io]
      summary: Los universos y por dónde entra y sale cada uno.
      responses:
        "200":
          description: Los universos.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Universe"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [io]
      summary: Añadir un universo.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {name: {type: string}}
      responses:
        "201":
          description: Los universos resultantes.
          content:
            application/json:
              schema: {type: object, properties: {universes: {type: array, items: {$ref: "#/components/schemas/Universe"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/universes/{index}:
    patch:
      tags: [io]
      summary: Patchear un universo — su salida DMX, su entrada MIDI y su feedback.
      description: |
        Aquí se configura la entrada y la salida de una mesa entera. Un `plugin`
        vacío desconecta. El `profile` de la entrada es lo que le da sentido a
        las notas y los CC de un ala MIDI; sin él llegan números sin nombre.

        Fuera del anillo de undo, como en la referencia: el patch de I/O
        describe la máquina, no el show.
      parameters: [{$ref: "#/components/parameters/universeIndex"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                passthrough: {type: boolean, description: "Reenvía a la salida lo que entra, sin pasar por el motor."}
                output:
                  type: object
                  description: Por dónde sale el DMX de este universo.
                  properties:
                    plugin: {type: string, description: "Un nombre de GET /io — ArtNet, E1.31, DMX USB, MIDI, OSC."}
                    line: {type: string, description: "La línea concreta de ese plugin."}
                    index: {type: integer, description: "Para plugins con varias salidas por línea."}
                input:
                  type: object
                  description: Por dónde entra el control — un ala MIDI, OSC, un HID.
                  properties:
                    plugin: {type: string}
                    line: {type: string}
                    profile: {type: string, description: "Perfil de entrada, de los que lista GET /io."}
                feedback:
                  type: object
                  description: Adónde vuelven los faders motorizados y los LEDs de la superficie.
                  properties:
                    plugin: {type: string}
                    line: {type: string}
      responses:
        "200":
          description: Todos los universos, ya patcheados.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Universe"}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [io]
      summary: Quitar un universo.
      parameters: [{$ref: "#/components/parameters/universeIndex"}]
      responses:
        "200":
          description: Quitado.
          content:
            application/json:
              schema: {type: object, properties: {removed: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/universes/{index}/parameters:
    put:
      tags: [io]
      summary: Los ajustes finos de un patch — los knobs que expone el plugin.
      parameters: [{$ref: "#/components/parameters/universeIndex"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: {type: string, enum: [input, output, feedback]}
                index: {type: integer}
                parameters: {type: object, additionalProperties: true}
      responses:
        "200":
          description: El universo.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/universes/{index}/map:
    get:
      tags: [io]
      summary: El mapa de direcciones de un universo — qué canal ocupa quién.
      description: Lo que hay que mirar antes de patchear una lámpara nueva, para no pisar una dirección.
      parameters: [{$ref: "#/components/parameters/universeIndex"}]
      responses:
        "200":
          description: Los 512 canales, con quién los ocupa y cuántos quedan libres.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  name: {type: string}
                  used: {type: integer}
                  free: {type: integer}
                  fixtures: {type: array, items: {type: object, additionalProperties: true}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/universes/{index}/dmx:
    get:
      tags: [directo]
      summary: Qué está saliendo por este universo ahora mismo.
      description: |
        El bucle de verificación. La interfaz web lee los frames del WebSocket,
        pero un cliente que no puede sostener un socket —un script, una shell,
        un agente moviendo la mesa con curl— no tiene forma de comprobar su
        propio trabajo, y configurar un rig sin mirar nunca la salida es
        configurarlo a ciegas.

        Son los valores **después del grand master**, que es lo que reciben las
        lámparas: una foto que lo ignorase diría que el rig está encendido en
        mitad de un fundido a negro.

        `active` es lo que de verdad se lee: los canales que no están a cero,
        con el nombre de su fixture y de su canal. 512 ceros es lo que parece un
        universo la mayor parte del tiempo y no le dicen nada a nadie;
        «Cabeza L · Dimmer · 255» es la línea que contesta «¿ha funcionado?».
      parameters: [{$ref: "#/components/parameters/universeIndex"}]
      responses:
        "200":
          description: La foto del universo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  universe: {type: integer}
                  blackout: {type: boolean}
                  values:
                    type: array
                    description: Los 512 canales, en orden, de 0 a 255.
                    items: {type: integer, minimum: 0, maximum: 255}
                  active:
                    type: array
                    description: Solo los que no están a cero, con nombre.
                    items:
                      type: object
                      properties:
                        channel: {type: integer, description: "Canal dentro del universo, desde 0."}
                        value: {type: integer, minimum: 0, maximum: 255}
                        fixture: {type: integer}
                        fixtureName: {type: string}
                        channelName: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/inputprofiles:
    post:
      tags: [io]
      summary: Crear un perfil de entrada.
      description: Para una superficie MIDI que la librería no trae.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manufacturer, model]
              properties:
                manufacturer: {type: string}
                model: {type: string}
                type: {type: string, enum: [MIDI, OSC, HID, DMX]}
      responses:
        "201":
          description: El perfil creado.
          content:
            application/json:
              schema: {type: object, properties: {name: {type: string}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/inputprofiles/{name}:
    get:
      tags: [io]
      summary: Un perfil de entrada, canal a canal.
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: El perfil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  manufacturer: {type: string}
                  model: {type: string}
                  type: {type: string}
                  editable: {type: boolean, description: "Los que trae la librería no lo son."}
                  channels: {type: array, items: {type: object, additionalProperties: true}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [io]
      summary: Borrar un perfil de entrada propio.
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Borrado.
          content:
            application/json:
              schema: {type: object, properties: {removed: {type: string}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/inputprofiles/{name}/channels/{channel}:
    put:
      tags: [io]
      summary: Nombrar un canal de un perfil de entrada.
      description: Es lo que convierte «canal 47» en «Fader 3», que es lo que hace legible un mapeo.
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
        - name: channel
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                type: {type: string, enum: [Button, Slider, Knob, Encoder, Prev, Next, Page]}
      responses:
        "200":
          description: El canal.
          content:
            application/json:
              schema: {type: object, properties: {channel: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [io]
      summary: Quitar un canal de un perfil de entrada.
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
        - name: channel
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Quitado.
          content:
            application/json:
              schema: {type: object, properties: {removed: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/input/last:
    get:
      tags: [io]
      summary: La última entrada externa que vio el daemon.
      description: |
        Cómo se aprende un mapeo: se pulsa el control físico y se pregunta aquí.
        Nadie sabe que su fader es el canal 47 del universo de entrada 1, y un
        formulario que pide dos números es un formulario que nadie rellena.
      responses:
        "200":
          description: Qué se movió y cuándo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seen: {type: boolean}
                  universe: {type: integer}
                  channel: {type: integer}
                  value: {type: integer}
                  note: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/beat:
    get:
      tags: [io]
      summary: De dónde viene el pulso y a cuánto va.
      responses:
        "200":
          description: La fuente y los BPM.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: {type: string, enum: [internal, midi, audio, none]}
                  bpm: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      tags: [io]
      summary: Cambiar la fuente del pulso o los BPM internos.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                source: {type: string, enum: [internal, midi, audio, none]}
                bpm: {type: integer}
      responses:
        "200":
          description: Lo que quedó.
          content:
            application/json:
              schema: {type: object, properties: {source: {type: string}, bpm: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/audio:
    get:
      tags: [io]
      summary: Las entradas y salidas de audio, y cuál está elegida.
      description: |
        Elegir la entrada es la diferencia entre un widget que no funciona y uno
        que escucha el conector equivocado: la entrada por defecto de Qt puede
        ser un jack de auriculares sin nada enchufado, y desde la consola las
        dos cosas se ven idénticas.
      responses:
        "200":
          description: Los dispositivos y el estado de la captura.
          content:
            application/json:
              schema:
                type: object
                properties:
                  inputs: {type: array, description: Nombres de dispositivo., items: {type: string}}
                  outputs: {type: array, items: {type: string}}
                  selected: {type: string}
                  capturing: {type: boolean}
                  canPlay: {type: boolean}
                  formats: {type: array, items: {type: string}}
                  unavailable: {type: boolean}
                  silentBecause: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      tags: [io]
      summary: Elegir la entrada de audio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {input: {type: string}}
      responses:
        "200":
          description: Lo elegido y si está capturando.
          content:
            application/json:
              schema: {type: object, properties: {selected: {type: string}, capturing: {type: boolean}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/live:
    get:
      tags: [directo]
      summary: Los valores que la mesa en vivo está sujetando ahora.
      responses:
        "200":
          description: Los valores.
          content:
            application/json:
              schema: {type: object, properties: {values: {$ref: "#/components/schemas/Values"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      tags: [directo]
      summary: Clavar valores absolutos en canales sueltos.
      description: |
        **No es una edición**: no toca el documento y no sobrevive a una
        recarga. Es lo que hace falta para un color —rojo 255, verde 40, azul
        0—, que un fader de nivel no puede porque sujeta todos sus canales a UN
        valor. Soltar con DELETE baja los canales a cero en vez de dejarlos
        enganchados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values: {$ref: "#/components/schemas/Values"}
      responses:
        "200":
          description: Cuántos canales quedan sujetos.
          content:
            application/json:
              schema: {type: object, properties: {held: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [directo]
      summary: Soltar la mesa en vivo.
      responses:
        "200":
          description: Cuántos quedan sujetos.
          content:
            application/json:
              schema: {type: object, properties: {held: {type: integer}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/simpledesk/{universe}:
    get:
      tags: [mesa]
      summary: Qué sujeta la Simple Desk en un universo.
      parameters:
        - name: universe
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Los canales sujetos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  universe: {type: integer}
                  held:
                    type: object
                    description: Indexado por canal del universo, 1-based, igual que el PUT.
                    additionalProperties: {type: integer, minimum: 0, maximum: 255}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [mesa]
      summary: Soltar el universo entero.
      parameters:
        - name: universe
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Cuántos se soltaron.
          content:
            application/json:
              schema: {type: object, properties: {released: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/simpledesk/{universe}/channels:
    put:
      tags: [mesa]
      summary: Sujetar canales desde la Simple Desk.
      parameters:
        - name: universe
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  description: |
                    Indexado por canal del universo, **de 1 a 512** — lo que
                    teclea un operador, no el desplazamiento interno. La
                    petición se valida entera antes de que aterrice nada: una
                    que es medio disparate no puede ocurrir a medias.
                  additionalProperties: {type: integer, minimum: 0, maximum: 255}
                  examples: [{"1": 255, "6": 128}]
      responses:
        "200":
          description: Los canales sujetos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  universe: {type: integer}
                  held:
                    type: object
                    description: Indexado por canal del universo, 1-based, igual que el PUT.
                    additionalProperties: {type: integer, minimum: 0, maximum: 255}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/simpledesk/{universe}/channels/{channel}:
    delete:
      tags: [mesa]
      summary: Soltar un canal.
      parameters:
        - name: universe
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: channel
          in: path
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: Soltado.
          content:
            application/json:
              schema: {type: object, properties: {released: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/simpledesk/{universe}/keypad:
    post:
      tags: [mesa]
      summary: El keypad — «1 THRU 12 @ FULL», como en una mesa de verdad.
      parameters:
        - name: universe
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command: {type: string, examples: ["1 THRU 12 @ FULL"]}
      responses:
        "200":
          description: A cuántos canales llegó.
          content:
            application/json:
              schema: {type: object, properties: {universe: {type: integer}, applied: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/grandmaster:
    get:
      tags: [mesa]
      summary: Dónde está el grand master.
      responses:
        "200":
          description: Su valor y sus modos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: {type: integer, minimum: 0, maximum: 255}
                  valueMode:
                    type: string
                    description: "`Reduce` escala hacia abajo; `Limit` recorta por arriba."
                    enum: [Reduce, Limit]
                  channelMode:
                    type: string
                    description: "`Intensity` solo toca los canales de intensidad; `All`, todos."
                    enum: [Intensity, All]
                  visible: {type: boolean}
                  input:
                    type: [object, "null"]
                    description: El control externo atado al fader grande.
                    properties:
                      universe: {type: integer}
                      channel: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      tags: [mesa]
      summary: Mover el grand master.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value: {type: integer, minimum: 0, maximum: 255}
                valueMode: {type: string, enum: [Reduce, Limit]}
                channelMode: {type: string, enum: [Intensity, All]}
                visible: {type: boolean}
                input:
                  type: [object, "null"]
                  description: |
                    `{universe, channel}` ata, `null` desata, ausente lo deja
                    como está — el mismo contrato que el control externo de un
                    widget.
                  properties:
                    universe: {type: integer}
                    channel: {type: integer}
      responses:
        "200":
          description: Cómo quedó.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/blackout:
    post:
      tags: [mesa]
      summary: Blackout.
      responses:
        "200":
          description: A oscuras.
          content:
            application/json:
              schema: {type: object, properties: {blackout: {type: boolean}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [mesa]
      summary: Quitar el blackout.
      responses:
        "200":
          description: Vuelve la luz.
          content:
            application/json:
              schema: {type: object, properties: {blackout: {type: boolean}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/stop:
    post:
      tags: [mesa]
      summary: Parar todo lo que esté corriendo.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fadeMs: {type: integer, description: "Con qué fundido, en milisegundos."}
      responses:
        "200":
          description: Cuántas funciones se pararon.
          content:
            application/json:
              schema: {type: object, properties: {stopping: {type: integer}, fadeMs: {type: integer}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/dump:
    get:
      tags: [mesa]
      summary: Qué se llevaría un volcado del estado actual del rig.
      responses:
        "200":
          description: Los canales sueltos y los que caen en un grupo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: {type: integer, description: Cuántos canales se llevaría en total.}
                  bare: {type: integer, description: Cuántos de ellos no caen en ningún grupo de canales.}
                  groups: {type: array, items: {type: object, additionalProperties: true}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [mesa]
      summary: Volcar lo que está puesto ahora mismo a una escena nueva.
      description: Cómo se construye una escena de verdad — se monta el look en el rig y se guarda.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, description: "Cómo se llamará la escena nueva."}
                sceneId: {type: integer, description: "Volcar sobre una escena que ya existe en vez de crear una."}
                nonZeroOnly: {type: boolean, description: "Dejar fuera los canales que están a cero."}
                groups:
                  type: array
                  description: |
                    Qué grupos de canal entran — Intensity, Colour, Pan, Tilt,
                    Gobo… Vacío es todos. Volcar solo la intensidad es cómo se
                    guarda un look de dímeres sin llevarse las posiciones.
                  items: {type: string}
      responses:
        "201":
          description: La escena creada y cuántos canales lleva.
          content:
            application/json:
              schema: {type: object, properties: {scene: {type: integer}, written: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        El token de `~/.orchidlights/api-token`. Obligatorio cuando el daemon
        escucha fuera de loopback, y siempre para las rutas que tocan el disco
        o apagan el proceso. Se compara en tiempo constante.

  parameters:
    fixtureId:
      name: id
      in: path
      required: true
      description: Identificador de la fixture, asignado por el motor.
      schema: {type: integer, minimum: 0}
    functionId:
      name: id
      in: path
      required: true
      description: Identificador de la función, asignado por el motor.
      schema: {type: integer, minimum: 0}
    universeIndex:
      name: index
      in: path
      required: true
      description: Universo, contado desde 1.
      schema: {type: integer, minimum: 1}
    widgetId:
      name: id
      in: path
      required: true
      description: Identificador del widget de la Virtual Console.
      schema: {type: integer, minimum: 0}

  responses:
    BadRequest:
      description: La petición no describe una operación válida.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Falta el token, o el presentado no es el de esta mesa.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: La máscara de acceso de esta mesa cierra esa área.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: No existe lo que se pide.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: |
        La operación es válida pero rompería algo — una función que otra usa,
        un solape en una pista, una dirección DMX ocupada.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      description: Todo fallo se contesta así, con una frase que se le puede enseñar a un operador.
      required: [error]
      properties:
        error: {type: string, description: "Qué ha ido mal, en prosa."}

    Fixture:
      type: object
      description: Una lámpara del patch.
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string, description: "Familia del perfil: Moving Head, LED Bar, Dimmer…"}
        universe: {type: integer, minimum: 1, description: "Contado desde 1."}
        address: {type: integer, minimum: 1, description: "Primer canal, contado desde 1."}
        channels: {type: integer, description: "Cuántos canales ocupa el modo."}
        manufacturer: {type: string}
        model: {type: string}
        mode: {type: string}
        resolved:
          type: boolean
          description: |
            Falso cuando el perfil que nombra el proyecto no está en la
            librería de esta instalación. La fixture existe y ocupa sus
            canales, pero nadie sabe qué hace cada uno.
        heads: {type: integer}
        channelList:
          type: array
          description: >-
            Solo en GET /fixtures/{id} — la lista no los nombra, porque un rig de
            30 cabezas son mil nombres que nadie pidió.
          items:
            type: object
            properties:
              index: {type: integer}
              name: {type: string}
              group: {type: string}
        physical:
          type: object
          properties:
            weight: {type: number}
            power: {type: number}
            width: {type: number}
            height: {type: number}
            depth: {type: number}

    Function:
      type: object
      description: Una función del proyecto, sin su cuerpo.
      properties:
        id: {type: integer}
        name: {type: string}
        type:
          type: string
          enum: [Scene, Chaser, EFX, RGBMatrix, Collection, Script, Audio, Video, Show, Sequence]
        running: {type: boolean}
        flashing: {type: boolean, description: "Encendida por la capa de flash: un flash sujeto o un override enganchado. No es `running`."}
        path: {type: string, description: "Carpeta en el árbol de funciones."}
        fadeIn: {type: integer, description: "Milisegundos."}
        fadeOut: {type: integer, description: "Milisegundos."}
        duration: {type: integer, description: "Milisegundos."}
        runOrder: {type: string, enum: [loop, singleshot, pingpong, random]}
        direction: {type: string, enum: [forward, backward]}
        tempoType: {type: string, enum: [original, time, beats]}
        step: {type: integer, description: "Paso actual, solo en chasers."}
        steps: {type: integer, description: "Cuántos pasos tiene, solo en chasers."}

    Universe:
      type: object
      description: Un universo DMX y por dónde entra y sale.
      properties:
        id: {type: integer, minimum: 1}
        name: {type: string}
        patched: {type: boolean}
        passthrough: {type: boolean, description: "Reenvía a la salida lo que entra, sin pasar por el motor."}
        outputs:
          type: array
          items:
            type: object
            properties:
              plugin: {type: string, examples: [ArtNet, E1.31, DMX USB, MIDI, OSC]}
              output: {type: string, description: "La línea concreta del plugin."}
              parameters: {type: object, additionalProperties: true}
        input:
          type: object
          properties:
            plugin: {type: string}
            line: {type: string}
            profile: {type: string, description: "Perfil de entrada, para dar sentido a las notas y CC de un ala MIDI."}
            parameters: {type: object, additionalProperties: true}
        feedback:
          type: object
          description: Adónde van los faders motorizados y los LEDs de lo que esté patcheado como entrada.
          properties:
            plugin: {type: string}
            line: {type: string}

    PlanFixture:
      type: object
      description: |
        Una lámpara en el escenario. Las posiciones van en milímetros contra el
        `grid`. Una fixture sin colocar se devuelve sin coordenadas, no en el
        origen: un plano que apila calladamente todo lo no colocado en una
        esquina parece un plano y no lo es.
      properties:
        id: {type: integer}
        name: {type: string}
        universe: {type: integer}
        address: {type: integer}
        channels: {type: integer}
        x: {type: number}
        y: {type: number}
        z: {type: number}
        rotation: {type: number, description: "Giro sobre el eje vertical, en grados."}
        rotationX: {type: number}
        rotationZ: {type: number}
        gel: {type: string, description: 'Color del filtro, en "#rrggbb".'}
        zoom: {type: integer}
        hidden: {type: boolean}
        locked: {type: boolean}
        invertPan: {type: boolean}
        invertTilt: {type: boolean}

    Device:
      type: object
      properties:
        id: {type: integer, description: "No se reutiliza: una fila revocada no vuelve como la de otro."}
        name: {type: string}
        role: {type: string, enum: [operate, design]}
        created: {type: string}
        lastSeen: {type: [string, "null"], description: "La última vez que presentó su llave desde que arrancó el daemon."}
        connections: {type: integer, description: "WebSockets abiertos con su llave ahora mismo."}

    VcWidget:
      type: object
      description: |
        Un widget de la Virtual Console, con la geometría original del lienzo en
        que se diseñó el show. La interfaz la lee como intención, no la escala.
      properties:
        id: {type: integer}
        type:
          type: string
          description: |
            En minúscula, que es como lo emite el daemon. Al crear se acepta de
            cualquier forma: `tagForType` no distingue mayúsculas.
          enum: [frame, soloframe, button, slider, label, speeddial, xypad, cuelist, clock, audiotriggers, matrix]
        caption: {type: string}
        x: {type: integer}
        y: {type: integer}
        width: {type: integer}
        height: {type: integer}
        page: {type: integer}
        speedInputs:
          type: array
          description: |
            Solo un dial de tempo, y solo los mandos que tiene asignados: tap,
            multiplicar, dividir y volver al tempo de partida, cada uno con su
            control externo. El universo es de entrada, no de DMX.
          items:
            type: object
            properties:
              control: {type: string, enum: [tap, multiply, divide, reset, unknown]}
              universe: {type: integer}
              channel: {type: integer}
        children:
          type: array
          items: {$ref: "#/components/schemas/VcWidget"}

    Values:
      type: array
      description: |
        Valores absolutos clavados en canales sueltos. Se direccionan por
        fixture y por el índice del canal DENTRO de ella, no por universo: es
        la misma pareja que usan las escenas, así que un look montado aquí se
        vuelca a escena sin traducir nada.
      items:
        type: object
        required: [fixture, channel, value]
        properties:
          fixture: {type: integer, minimum: 0}
          channel: {type: integer, minimum: 0, description: "Índice dentro de la fixture, contado desde 0."}
          value: {type: integer, minimum: 0, maximum: 255}

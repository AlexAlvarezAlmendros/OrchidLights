# OrchidLights — contrato de la API HTTP.
#
# Esta es la descripción legible por máquinas de las 145 operaciones que el
# daemon expone. Está escrita a mano, y por eso mismo `server/test/openapi-smoke.sh`
# la compara en CI contra la tabla de rutas real de `server/src/apiserver.cpp`:
# una ruta nueva sin documentar rompe el build, y una documentada que ya no
# existe, también. Una spec que miente es peor que no tener ninguna, porque el
# cliente que la lee se la cree.
#
# Convenciones que valen para todo el documento:
#
#   · Universos y direcciones DMX son 1-based, como lo que va impreso en el
#     fixture y lo que teclea un operador. El motor los cuenta desde 0 por
#     dentro; la conversión ocurre en JsonView y solo ahí.
#   · Los tiempos van en milisegundos.
#   · Los identificadores los asigna el motor (el hueco libre más bajo), así
#     que un cliente los descubre, no los elige. Para escribir un proyecto
#     entero de una vez, direccionado por nombre, está /api/v1/spec.
#   · Toda edición es en memoria hasta POST /api/v1/project/save.

openapi: 3.1.0

info:
  title: OrchidLights
  version: "1"
  summary: Control de iluminación DMX — motor QLC+ con API HTTP y WebSocket.
  description: |
    El API vive en el mismo proceso que el motor de tiempo real, así que una
    escritura llega al `MasterTimer` sin cruzar un socket ni un proceso.

    **Autenticación.** En loopback no se pide nada: el sistema operativo ya es
    la frontera. `--listen-all` abre el daemon a la red y activa el token
    automáticamente, que se guarda en `~/.orchidlights/api-token` con permisos
    600. Las rutas que llegan al disco o matan el proceso exigen el token
    siempre, incluso en loopback.

    **Tiempo real.** El WebSocket de `/ws` emite frames DMX agrupados por
    universo a 25 Hz y el estado de las funciones, los widgets y el cabezal de
    los shows. Un cliente que necesite ver el efecto de lo que escribe debe
    escuchar ahí, no sondear.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: OrchidLights
    url: https://github.com/AlexAlvarezAlmendros/OrchidLights

servers:
  - url: http://127.0.0.1:9998
    description: El daemon en la máquina local, que es donde escucha por defecto.
  - url: http://{host}:{port}
    description: Una mesa alcanzable en la red, arrancada con --listen-all.
    variables:
      host: {default: mesa.local}
      port: {default: "9998"}

security:
  - bearerAuth: []
  - {}

tags:
  - name: descubrimiento
    description: Qué es esta mesa y qué sabe hacer.
  - name: proyecto
    description: Abrir, guardar y describir el `.qxw` cargado.
  - name: spec
    description: |
      El proyecto entero como un documento declarativo, direccionado por nombre.
      Es la vía pensada para agentes y para tener un show en control de versiones.
  - name: fixtures
    description: El patch — qué lámparas hay, en qué universo y en qué dirección.
  - name: librería
    description: Los 1.735 perfiles de fixture que trae el proyecto.
  - name: grupos
    description: Grupos de fixtures y grupos de canales.
  - name: funciones
    description: Escenas, chasers, EFX, matrices RGB, colecciones, scripts, audio, vídeo y shows.
  - name: consola
    description: La Virtual Console — sus widgets, su disposición y su historial.
  - name: plano
    description: Dónde está cada lámpara en el escenario, en 2D y en 3D.
  - name: io
    description: Universos, patch de entrada y salida, perfiles de entrada, MIDI.
  - name: directo
    description: Lo que ocurre ahora mismo en el rig y no es una edición.
  - name: mesa
    description: Simple Desk, grand master, blackout y volcado a escena.
  - name: sistema
    description: Undo global, acceso, clientes remotos y apagado.

paths:
  /api/v1:
    get:
      tags: [descubrimiento]
      summary: Qué es esta mesa y qué sabe hacer.
      description: |
        El punto de entrada para un cliente que no sabe nada todavía: versión,
        dónde está el contrato completo, si hace falta token y qué áreas están
        abiertas. Un cliente que empieza aquí no tiene que adivinar nada.

        Contesta **sin token a propósito**: un cliente que tiene que
        autenticarse para enterarse de que tiene que autenticarse es un cliente
        que adivina. El bloque `project` es la excepción — su nombre y su ruta
        dicen algo del sitio, así que solo sale para quien presentó el token.
      security: [{}]
      responses:
        "200":
          description: El documento de descubrimiento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  version: {type: string, description: "Versión del programa."}
                  apiVersion: {type: integer}
                  openapi: {type: string, description: "Ruta del contrato completo."}
                  websocket: {type: string}
                  authRequired: {type: boolean}
                  role:
                    type: string
                    enum: [open, master, design, operate]
                    description: "Quién pregunta: la llave maestra, un dispositivo emparejado con su rol, o nadie en particular."
                  access:
                    type: object
                    description: Las áreas abiertas para quien pregunta — la máscara de la mesa, estrechada para un dispositivo de operador.
                    additionalProperties: {type: boolean}
                  project:
                    type: object
                    properties:
                      path: {type: string}
                      name: {type: string}
                      modified: {type: boolean}

  /api/v1/openapi.json:
    get:
      tags: [descubrimiento]
      summary: Este mismo contrato, en JSON.
      description: |
        Servido por el daemon para que un cliente lo lea de la mesa que tiene
        delante en vez de de un repositorio que puede ir por otra versión.
      security: [{}]
      responses:
        "200":
          description: El documento OpenAPI.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "404":
          description: Esta instalación no trae el contrato.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/status:
    get:
      tags: [descubrimiento]
      summary: El estado de la mesa en una sola llamada.
      responses:
        "200":
          description: Cuántas fixtures y funciones hay, cuántas corren, y si está en blackout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  version: {type: string}
                  apiVersion: {type: integer}
                  fixtureLibrary: {type: string}
                  manufacturers: {type: integer}
                  fixtures: {type: integer}
                  functions: {type: integer}
                  universes: {type: integer}
                  runningFunctions: {type: integer}
                  blackout: {type: boolean}
                  outputPlugins: {type: array, items: {type: string}}
                  audioFormats: {type: array, items: {type: string}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/shutdown:
    post:
      tags: [sistema]
      summary: Apagar el daemon limpiamente.
      description: Exige token aunque la mesa escuche solo en loopback.
      responses:
        "200":
          description: Se apaga.
          content:
            application/json:
              schema: {type: object, properties: {shuttingDown: {type: boolean}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/undo:
    post:
      tags: [sistema]
      summary: Deshacer la última edición.
      description: |
        Undo global por instantáneas — cada ruta que muta guarda el XML de lo
        que toca, antes y después, en un anillo de ~200. Fuera del anillo quedan
        la mesa en vivo y el estado de ejecución: parar un chaser no es una edición.
      responses:
        "200":
          description: Qué se deshizo y qué queda.
          content:
            application/json:
              schema:
                type: object
                properties:
                  undone: {type: string, description: "Etiqueta de lo deshecho."}
                  undo: {type: boolean, description: "Si queda algo más que deshacer."}
                  redo: {type: boolean}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/redo:
    post:
      tags: [sistema]
      summary: Rehacer lo último deshecho.
      responses:
        "200":
          description: Qué se rehízo y qué queda.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redone: {type: string}
                  undo: {type: boolean}
                  redo: {type: boolean, description: "Si queda algo más que rehacer."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/history:
    get:
      tags: [sistema]
      summary: El anillo de undo, para enseñárselo a alguien.
      description: |
        El anillo guarda **200 entradas**, y se vacía al cargar otro proyecto:
        una entrada del show anterior se desharía sobre este. Lo que se aplica
        en bloque va dentro de un lote (`POST /undo/batch`) y ocupa una sola
        entrada, con `edits` diciendo cuántas ediciones lleva dentro.

        `undo` y `redo` son **booleanos** —si queda algo a cada lado—, no
        contadores. `GET /vc/history` sí cuenta, porque la consola lleva su
        propio historial con profundidad.
      responses:
        "200":
          description: Las entradas, de la más antigua a la más reciente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        label: {type: string, description: "Qué operación fue."}
                        scope: {type: integer, description: "Sobre qué clase de cosa."}
                        items: {type: integer, description: "Cuántas entidades tocó."}
                        edits: {type: integer, description: "Solo un lote: cuántas ediciones lleva dentro."}
                  batch: {type: boolean, description: "Si hay un lote abierto recogiendo ediciones."}
                  undo: {type: boolean}
                  redo: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/undo/batch:
    post:
      tags: [sistema]
      summary: Abrir un lote de undo.
      description: |
        Todo lo que se edite mientras el lote está abierto se sella como **una
        sola entrada** del anillo: un `POST /undo` lo deshace entero, en orden
        inverso, y un `POST /redo` lo rehace entero. Es lo que permite deshacer
        un documento aplicado de cientos de llamadas sin comerse el anillo.

        Los lotes no se anidan: abrir uno con otro abierto sella el anterior.
        Un lote recoge **todas** las ediciones de la mesa mientras está abierto,
        vengan de quien vengan. Uno que pasa 30 segundos sin recibir ninguna se
        sella solo, para que las ediciones de otro no acaben dentro de un lote
        abandonado; y un `POST /undo` con un lote abierto lo sella antes de
        deshacerlo.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string, description: "Cómo aparecerá en el historial. Por defecto `batch`."}
      responses:
        "201":
          description: El lote está abierto.
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: {type: boolean}
                  label: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
    delete:
      tags: [sistema]
      summary: Cerrar el lote y sellarlo como una entrada.
      description: |
        Idempotente: cerrar sin lote abierto no es un error y sella cero
        ediciones. Un lote que no recogió nada no deja entrada.
      responses:
        "200":
          description: Cuántas ediciones quedaron selladas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sealed: {type: integer, description: "Ediciones dentro de la entrada sellada; 0 si no había lote o estaba vacío."}
                  undo: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/access:
    get:
      tags: [sistema]
      summary: Qué áreas de esta mesa están abiertas para quien pregunta.
      description: |
        La máscara de la mesa, y para un dispositivo de operador además
        estrechada a la consola y la mesa simple: cada cliente lee la jaula en
        la que está. La llave maestra y un dispositivo de diseño se saltan la
        máscara en el daemon, pero la leen igual — la interfaz la usa para
        esconder lo que la mesa tiene cerrado.
      responses:
        "200":
          description: La máscara, área por área.
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: {type: string, enum: [open, master, design, operate]}
                  fixtures: {type: boolean}
                  functions: {type: boolean}
                  vcControl: {type: boolean}
                  vcEditing: {type: boolean}
                  simpleDesk: {type: boolean}
                  show: {type: boolean}
                  io: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [sistema]
      summary: Cerrar o abrir áreas — el modo kiosko del móvil que se presta.
      description: |
        La máscara vive en el daemon, no en el navegador: cerrarla solo en un
        cliente es no cerrarla. Exige la llave maestra siempre: ningún
        dispositivo ensancha su propia jaula.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                preset:
                  type: string
                  enum: [all, operate, kiosk]
                  description: "`operate` deja consola y mesa; `kiosk` solo la consola."
                fixtures: {type: boolean}
                functions: {type: boolean}
                vcControl: {type: boolean}
                vcEditing: {type: boolean}
                simpleDesk: {type: boolean}
                show: {type: boolean}
                io: {type: boolean}
      responses:
        "200":
          description: La máscara resultante.
          content:
            application/json:
              schema: {type: object, properties: {mask: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/remote:
    get:
      tags: [sistema]
      summary: Dónde se alcanza esta mesa y quién está conectado.
      description: |
        Las URLs de acceso **no llevan llave**: repartir la maestra en un QR
        hacía dueño de la mesa a cualquiera que lo escanease. Un móvil entra
        emparejándolo (`POST /devices`), y la URL que devuelve lleva una llave
        suya. Cada cliente conectado dice con qué rol entró y, si fue con la
        llave de un dispositivo, cuál (`device`, `deviceId`).
      responses:
        "200":
          description: Direcciones, puerto y clientes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  port: {type: integer}
                  listenAll: {type: boolean}
                  authRequired: {type: boolean}
                  localUrl: {type: string}
                  addresses: {type: array, items: {type: object, additionalProperties: true}}
                  clients: {type: array, items: {type: object, additionalProperties: true}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/devices:
    get:
      tags: [sistema]
      summary: Los dispositivos emparejados.
      description: |
        Cada móvil con su llave y su rol, revocable uno a uno. Solo la llave
        maestra los ve, los empareja, los cambia y los revoca: un dispositivo
        no puede emparejar más de sí mismo, ensancharse el rol ni salvar a un
        compañero revocado. La llave de un dispositivo no se guarda — el daemon
        guarda su SHA-256 —, así que esta lista nunca la lleva.
      responses:
        "200":
          description: Los dispositivos, del más antiguo al más reciente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: {$ref: "#/components/schemas/Device"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [sistema]
      summary: Emparejar un dispositivo — su llave, esta vez y no más.
      description: |
        `operate` maneja la consola y la mesa simple bajo la máscara, más
        blackout, grand master, parar todo y la mesa en vivo; no construye
        nada. `design` hace todo lo que la maestra salvo tocar el disco, apagar
        el daemon, la máscara y los dispositivos, y se salta la máscara.

        La respuesta lleva la llave y las URLs con ella dentro, para un QR. Es
        la única vez que existe fuera del móvil: uno que la pierde se vuelve a
        emparejar.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, description: "Cómo se reconoce en la lista: «Truss izquierdo», «iPad de Ana»."}
                role: {type: string, enum: [operate, design], description: "Por defecto `operate`."}
      responses:
        "201":
          description: Emparejado.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Device"}
                  - type: object
                    properties:
                      key: {type: string, description: "La llave: 64 hexadecimales."}
                      urls: {type: array, items: {type: object, additionalProperties: true}, description: "Cada puerta de red con la llave en el fragmento. Vacío si el daemon solo escucha en loopback."}
                      localUrl: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/devices/{id}:
    patch:
      tags: [sistema]
      summary: Renombrar un dispositivo o cambiarle el rol.
      description: |
        El rol nuevo se nota en la siguiente petición. Sus WebSockets abiertos
        se cierran para que vuelvan a entrar con él.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                role: {type: string, enum: [operate, design]}
      responses:
        "200":
          description: El dispositivo, como queda.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Device"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [sistema]
      summary: Revocar un dispositivo — y echarlo ya.
      description: |
        Su llave deja de valer en la siguiente petición, y sus WebSockets
        abiertos se cierran ahora: revocar no es esperar a que vuelva a llamar.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200":
          description: Revocado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: {type: integer}
                  closed: {type: integer, description: "Cuántas conexiones abiertas se cerraron."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/remote/clients/{id}:
    delete:
      tags: [sistema]
      summary: Echar a un cliente de la mesa.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Cerrado.
          content:
            application/json:
              schema: {type: object, properties: {closed: {type: boolean}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/project:
    get:
      tags: [proyecto]
      summary: Qué proyecto está cargado.
      responses:
        "200":
          description: Ruta, nombre, si tiene cambios sin guardar y si hay un autoguardado que le sobrevive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
                  name: {type: string}
                  directory: {type: string}
                  modified: {type: boolean}
                  startupFunction: {type: integer, description: "-1 si no hay."}
                  autosave:
                    type: object
                    description: |
                      Una copia de recuperación más nueva que el proyecto al que
                      sombrea. Se informa, nunca se carga sola: el operador
                      decide si los últimos treinta segundos del cuelgue valen
                      más que lo que dice el fichero.
                    properties:
                      name: {type: string}
                      savedAt: {type: string, format: date-time}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      tags: [proyecto]
      summary: Ajustes del proyecto — la función con la que abre el show.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startupFunction: {type: integer, description: "-1 para ninguna."}
      responses:
        "200":
          description: El ajuste resultante.
          content:
            application/json:
              schema: {type: object, properties: {startupFunction: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/projects:
    get:
      tags: [proyecto]
      summary: Los proyectos del directorio de trabajo.
      responses:
        "200":
          description: El directorio y lo que hay dentro.
          content:
            application/json:
              schema:
                type: object
                properties:
                  directory: {type: string}
                  projects:
                    type: array
                    description: Los nombres de fichero, sin ruta — que es lo que aceptan las rutas de proyecto.
                    items: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/project/recents:
    get:
      tags: [proyecto]
      summary: Los últimos proyectos abiertos.
      description: |
        Exige el token aunque la mesa escuche solo en loopback: son rutas de
        disco de esta máquina, y «cualquier cosa en este ordenador puede usar la
        mesa» no debe crecer hasta «cualquier cosa que alcance este socket puede
        leer por dónde ando».
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Con una marca de si el fichero sigue estando.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recents:
                    type: array
                    items:
                      type: object
                      properties:
                        path: {type: string}
                        name: {type: string}
                        exists: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/project/new:
    post:
      tags: [proyecto]
      summary: Empezar un proyecto vacío.
      description: Descarta lo cargado. Exige token.
      responses:
        "200":
          description: El proyecto nuevo.
          content:
            application/json:
              schema: {type: object, properties: {path: {type: string}, modified: {type: boolean}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/project/open:
    post:
      tags: [proyecto]
      summary: Abrir un `.qxw` por ruta absoluta.
      description: Exige token — es una ruta que llega al disco.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string}
      responses:
        "200":
          description: |
            Abierto. `unresolved` nombra las fixtures cuyo perfil no está en la
            librería de esta instalación: el show carga, pero esas lámparas
            ocupan canales que nadie sabe leer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
                  unresolved: {type: array, items: {type: object, additionalProperties: true}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/project/load/{name}:
    post:
      tags: [proyecto]
      summary: Abrir un proyecto del directorio de trabajo, por nombre.
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Abierto.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: {type: string}
                  unresolved: {type: array, items: {type: object, additionalProperties: true}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/project/save:
    post:
      tags: [proyecto]
      summary: Guardar el proyecto donde estaba.
      description: |
        Toda edición vive en memoria hasta aquí. Un cliente que construye un
        show y no llama a esto no ha construido nada que sobreviva al daemon.
      responses:
        "200":
          description: Escrito.
          content:
            application/json:
              schema: {type: object, properties: {path: {type: string}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/project/save/{name}:
    post:
      tags: [proyecto]
      summary: Guardar con un nombre dentro del directorio de trabajo.
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Escrito.
          content:
            application/json:
              schema: {type: object, properties: {path: {type: string}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/project/save-as:
    post:
      tags: [proyecto]
      summary: Guardar en una ruta absoluta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties: {path: {type: string}}
      responses:
        "200":
          description: Escrito.
          content:
            application/json:
              schema: {type: object, properties: {path: {type: string}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/project/recover:
    post:
      tags: [proyecto]
      summary: Cargar la copia de recuperación que sombrea al proyecto.
      responses:
        "200":
          description: Recuperado.
          content:
            application/json:
              schema: {type: object, properties: {path: {type: string}, modified: {type: boolean}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/project/import/preview:
    post:
      tags: [proyecto]
      summary: Qué traería importar otro proyecto, sin traerlo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties: {path: {type: string}}
      responses:
        "200":
          description: Lo que hay en el otro fichero, para elegir.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/project/import:
    post:
      tags: [proyecto]
      summary: Traerse fixtures y funciones de otro proyecto.
      description: |
        Fuera del anillo de undo: deshacerlo necesitaría recargar el documento
        entero, y eso corta toda función que esté corriendo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string}
                fixtures: {type: array, items: {type: integer}}
                functions: {type: array, items: {type: integer}}
      responses:
        "200":
          description: Qué se trajo.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/assets:
    post:
      tags: [proyecto]
      summary: Subir un fichero al directorio del proyecto.
      description: Imágenes de fondo del plano, audio, vídeo.
      parameters:
        - name: name
          in: query
          required: true
          description: Nombre con el que guardarlo.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: Escrito.
          content:
            application/json:
              schema: {type: object, properties: {path: {type: string}, size: {type: integer}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/fixtures:
    get:
      tags: [fixtures]
      summary: El patch entero.
      responses:
        "200":
          description: Todas las lámparas, sin nombrar sus canales.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Fixture"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [fixtures]
      summary: Patchear una o varias lámparas iguales.
      description: |
        `quantity` con `gap` patchea una tira entera de una vez, que es como se
        patchea un rig de verdad. La dirección se comprueba contra lo que ya
        hay: dos fixtures en el mismo canal es un fallo que no se ve hasta que
        se enciende la sala.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manufacturer, model, mode]
              properties:
                manufacturer: {type: string}
                model: {type: string}
                mode:
                  type: string
                  description: |
                    El nombre exacto del modo, de los que lista
                    `GET /library/{fabricante}/{modelo}`.

                    Con `manufacturer` y `model` a `Generic` se patchea un
                    dímer genérico, que no es un fichero de la librería sino
                    algo que el motor sintetiza: ahí el modo dice cuántos
                    canales tiene, como "6 Channel".
                name: {type: string, description: "Si falta, se usa el modelo."}
                universe: {type: integer, minimum: 1, default: 1}
                address: {type: integer, minimum: 1, description: "Primer canal, contado desde 1."}
                quantity: {type: integer, minimum: 1, default: 1}
                gap: {type: integer, minimum: 0, default: 0, description: "Canales libres entre una y la siguiente."}
      responses:
        "201":
          description: Las creadas.
          content:
            application/json:
              schema: {type: object, properties: {created: {type: array, items: {type: integer}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/fixtures/{id}:
    get:
      tags: [fixtures]
      summary: Una lámpara, con sus canales nombrados.
      description: |
        "Dimmer" es el canal 6 en un modo y el 8 en otro, y nadie debería
        recordarlo a oscuras. Aquí van nombrados; en la lista no, porque un rig
        de 30 cabezas son mil nombres que nadie pidió.
      parameters: [{$ref: "#/components/parameters/fixtureId"}]
      responses:
        "200":
          description: La lámpara.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fixture"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [fixtures]
      summary: Renombrar o mover de dirección.
      parameters: [{$ref: "#/components/parameters/fixtureId"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                universe: {type: integer, minimum: 1}
                address: {type: integer, minimum: 1}
      responses:
        "200":
          description: La lámpara ya cambiada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Fixture"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [fixtures]
      summary: Despatchear una lámpara.
      description: |
        Se la lleva también de la Virtual Console. `Doc` reparte el id libre más
        bajo, así que dejar las referencias atrás significa que la siguiente
        fixture que se patchee hereda los sliders y el XY pad de esta.
      parameters: [{$ref: "#/components/parameters/fixtureId"}]
      responses:
        "200":
          description: Quitada, y cuántas referencias de consola se fueron con ella.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: {type: integer}
                  consoleReferencesRemoved: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/fixtures/{id}/clone:
    post:
      tags: [fixtures]
      summary: Duplicar una lámpara N veces a continuación.
      parameters: [{$ref: "#/components/parameters/fixtureId"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: {type: integer, minimum: 1, default: 1}
                gap: {type: integer, minimum: 0, default: 0}
      responses:
        "201":
          description: Las creadas.
          content:
            application/json:
              schema: {type: object, properties: {created: {type: array, items: {type: integer}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/fixtures/{id}/remap:
    post:
      tags: [fixtures]
      summary: Cambiar el perfil de una lámpara conservando lo que se pueda.
      description: |
        Cambiar de modelo o de modo cambia qué significa cada canal, así que
        `remap` traslada los valores que tienen equivalente y dice cuántos se
        quedaron por el camino.
      parameters: [{$ref: "#/components/parameters/fixtureId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                manufacturer: {type: string}
                model: {type: string}
                mode: {type: string}
                name: {type: string}
                universe: {type: integer, minimum: 1}
                address: {type: integer, minimum: 1}
      responses:
        "200":
          description: Qué se conservó y qué sliders quedaron tocados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  fixture: {type: string}
                  channel: {type: integer}
                  channelsCarried: {type: integer}
                  slidersTouched: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/fixtures/rgbpanel:
    post:
      tags: [fixtures]
      summary: Patchear un panel de LED entero como una matriz.
      description: |
        Un panel son cientos de píxeles: patchearlos de uno en uno no es una
        tarea, es una tarde. Se describe la rejilla y el daemon crea las
        fixtures y el grupo que las ordena.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows, columns]
              properties:
                name: {type: string}
                rows: {type: integer, minimum: 1}
                columns: {type: integer, minimum: 1}
                universe: {type: integer, minimum: 1}
                address: {type: integer, minimum: 1}
                components: {type: string, enum: [RGB, BGR, RGBW], description: "Orden de los componentes."}
                direction: {type: string, description: "Cómo serpentea el cableado por la rejilla."}
                startCorner: {type: string}
                displacement: {type: string}
                sixteenBit: {type: boolean}
                physicalWidth: {type: integer}
                physicalHeight: {type: integer}
      responses:
        "201":
          description: Las fixtures creadas y el grupo que las agrupa.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: {type: array, items: {type: integer}}
                  group: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/fixtures/{id}/modifiers:
    put:
      tags: [fixtures]
      summary: Curvas de respuesta por canal.
      description: Para dímeres que no responden lineales.
      parameters: [{$ref: "#/components/parameters/fixtureId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modifiers:
                  type: object
                  description: Índice de canal a nombre de plantilla; null quita la curva.
                  additionalProperties: {type: [string, "null"]}
      responses:
        "200":
          description: Las curvas resultantes.
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}, modifiers: {type: object, additionalProperties: true}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/library:
    get:
      tags: [librería]
      summary: Buscar en los 1.735 perfiles de fixture.
      parameters:
        - name: q
          in: query
          description: Filtro por fabricante o modelo. Sin él, la lista de fabricantes.
          schema: {type: string}
      responses:
        "200":
          description: Fabricantes que encajan, y cuántos hay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer, description: Cuántos perfiles tiene la librería entera.}
                  manufacturers:
                    type: array
                    description: Los nombres, tal cual se pasan a `GET /library/{manufacturer}`.
                    items: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/library/{manufacturer}:
    get:
      tags: [librería]
      summary: Los modelos de un fabricante.
      parameters:
        - name: manufacturer
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: El catálogo del fabricante.
          content:
            application/json:
              schema:
                type: object
                properties:
                  manufacturer: {type: string}
                  models: {type: array, items: {type: string}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/library/{manufacturer}/{model}:
    get:
      tags: [librería]
      summary: Un perfil, con sus modos y lo que hace cada canal.
      description: |
        Lo que hay que leer antes de patchear: el nombre exacto del modo y
        cuántos canales ocupa. Patchear con un modo que no existe falla, y
        patchear con el modo equivocado da un rig que se enciende y no obedece.
      parameters:
        - name: manufacturer
          in: path
          required: true
          schema: {type: string}
        - name: model
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: El perfil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  manufacturer: {type: string}
                  model: {type: string}
                  type: {type: string, description: "Familia del perfil: Moving Head, LED Bar, Dimmer…"}
                  modes:
                    type: array
                    description: |
                      Los modos, con cuántos canales ocupa cada uno. El nombre
                      tiene que ir exacto al patchear, y el número de canales es
                      lo que decide dónde cabe.
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        channels: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/functions:
    get:
      tags: [funciones]
      summary: Todas las funciones del proyecto.
      responses:
        "200":
          description: Sin sus cuerpos — para eso está `/functions/{id}/body`.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Function"}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [funciones]
      summary: Crear una función vacía.
      description: Nace sin cuerpo; se le pone con `/values`, `/steps` o `/body` según el tipo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type:
                  type: string
                  enum: [Scene, Chaser, EFX, RGBMatrix, Collection, Script, Audio, Video, Show, Sequence]
                name: {type: string}
      responses:
        "201":
          description: La función creada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Function"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/functions/{id}:
    patch:
      tags: [funciones]
      summary: Nombre, tiempos, sentido de marcha y carpeta.
      parameters: [{$ref: "#/components/parameters/functionId"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                fadeIn: {type: integer, description: "Milisegundos."}
                fadeOut: {type: integer, description: "Milisegundos."}
                duration: {type: integer, description: "Milisegundos."}
                runOrder: {type: string, enum: [loop, singleshot, pingpong, random]}
                direction: {type: string, enum: [forward, backward]}
                tempoType: {type: string, enum: [original, time, beats]}
                path: {type: string, description: "Carpeta. Presente y vacía mueve a la raíz, que es una petición de verdad y no un no-op."}
                fadeInMode: {type: string, enum: [default, common, perstep], description: "Solo chasers."}
                fadeOutMode: {type: string, enum: [default, common, perstep], description: "Solo chasers."}
                durationMode: {type: string, enum: [default, common, perstep], description: "Solo chasers."}
                timeDivision: {type: string, description: "Solo shows."}
                bpm: {type: integer, description: "Solo shows."}
      responses:
        "200":
          description: La función ya cambiada.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Function"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [funciones]
      summary: Borrar una función.
      description: |
        Se niega con 409 si otra cosa la usa —un chaser, una colección, un
        botón—, nombrando qué. `force=true` la borra igualmente.
      parameters:
        - {$ref: "#/components/parameters/functionId"}
        - name: force
          in: query
          schema: {type: string, enum: ["true", "false"]}
      responses:
        "200":
          description: Borrada.
          content:
            application/json:
              schema: {type: object, properties: {removed: {type: integer}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/functions/{id}/start:
    post:
      tags: [funciones]
      summary: Arrancar una función.
      description: |
        No es una edición: queda fuera del anillo de undo. El cambio de estado
        se anuncia por el WebSocket a todos los clientes.
      parameters: [{$ref: "#/components/parameters/functionId"}]
      responses:
        "200":
          description: Arrancando.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/functions/{id}/stop:
    post:
      tags: [funciones]
      summary: Parar una función.
      parameters: [{$ref: "#/components/parameters/functionId"}]
      responses:
        "200":
          description: Parando.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/functions/{id}/body:
    get:
      tags: [funciones]
      summary: De qué está hecha una función.
      description: |
        Los pasos de un chaser, los valores de una escena, los miembros de una
        colección, la geometría de un EFX, el algoritmo de una matriz, las
        pistas de un show — con nombres. Sin esto un cliente cambia un cuerpo
        que no puede ver, y eso no es editar, es adivinar.
      parameters: [{$ref: "#/components/parameters/functionId"}]
      responses:
        "200":
          description: El cuerpo, con la forma que corresponda al tipo.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      tags: [funciones]
      summary: Escribir el cuerpo de un EFX, una matriz, un script o un audio.
      description: |
        Los campos que se aceptan dependen del tipo de la función. Escenas y
        chasers tienen sus propias rutas, más finas.
      parameters: [{$ref: "#/components/parameters/functionId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fixtures:
                  type: array
                  description: |
                    "EFX: qué fixtures dibujan la figura, por id. También el
                    juego de fixtures contra el que una Scene resuelve sus
                    palettes."
                  items: {type: integer, minimum: 0}
                geometry:
                  type: object
                  description: |
                    "EFX: la figura — width, height, xOffset, yOffset, rotation,
                    startOffset, xFrequency, yFrequency, xPhase, yPhase. Se
                    aceptan aquí dentro, que es como los devuelve el GET, y
                    también sueltos en el nivel de arriba."
                  additionalProperties: {type: integer}
                propagation: {type: string, description: "EFX: en qué orden recorren las cabezas la figura."}
                algorithm: {type: string, description: "EFX o RGBMatrix."}
                fixtureGroup: {type: integer, description: "RGBMatrix: el grupo sobre el que corre."}
                colors: {type: array, description: "RGBMatrix: hasta cinco huecos de color.", items: {type: [string, "null"]}}
                data: {type: string, description: "Script: el texto del script."}
                source: {type: string, description: "Audio o Video: el fichero."}
                volume: {type: number, description: "Audio."}
                device: {type: string, description: "Audio: la salida por la que suena."}
                scene: {type: integer, description: "Sequence: la escena de la que cuelga."}
                palettes: {type: array, description: "Scene: las palettes aplicadas.", items: {type: integer}}
      responses:
        "200":
          description: El cuerpo resultante.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/functions/{id}/values:
    post:
      tags: [funciones]
      summary: Un canal de una fixture dentro de una escena.
      parameters: [{$ref: "#/components/parameters/functionId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fixture, channel, value]
              properties:

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>OrchidLights</title>
  <desc>An orchid bloom whose petals read as beams of light.</desc>
  <defs>
    <linearGradient id="ol-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B4DFF"/>
      <stop offset="55%" stop-color="#C238F5"/>
      <stop offset="100%" stop-color="#E81E9B"/>
    </linearGradient>
    <radialGradient id="ol-core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="45%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#FF9B3D"/>
    </radialGradient>
  </defs>

  <g fill="url(#ol-petal)">
    <ellipse cx="256" cy="146" rx="63" ry="116"/>
    <ellipse cx="256" cy="146" rx="63" ry="116" transform="rotate(72 256 256)"/>
    <ellipse cx="256" cy="146" rx="63" ry="116" transform="rotate(144 256 256)"/>
    <ellipse cx="256" cy="146" rx="63" ry="116" transform="rotate(216 256 256)"/>
    <ellipse cx="256" cy="146" rx="63" ry="116" transform="rotate(288 256 256)"/>
  </g>

  <circle cx="256" cy="256" r="58" fill="url(#ol-core)"/>
</svg>
